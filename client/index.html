<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050816" />
  <meta name="description" content="NEXUS ADMISSION — next-generation study program admission platform. Choose Your Future. Build Your Legacy." />
  <title>NEXUS ADMISSION</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/effects.css" />

  <script type="module" src="/src/main.js"></script>

<body>
  <!-- animated background layers -->
  <div class="bg-layer bg-gradient"></div>
  <div class="bg-layer bg-grid"></div>
  <div class="beam b1"></div>
  <div class="beam b2"></div>
  <canvas id="particles" aria-hidden="true"></canvas>
  <div class="cursor-glow" id="cursor-glow" aria-hidden="true"></div>

  <!-- boot loader -->
  <div class="boot" id="boot" role="status" aria-live="polite">
    <div class="boot-inner">
      <div class="boot-ring"><i></i><i></i><i></i></div>
      <div class="boot-logo grad-text">NEXUS</div>
      <div class="boot-lines" id="boot-lines"></div>
      <div class="boot-bar"><div id="boot-bar"></div></div>
    </div>
  </div>

  <header id="app-nav"></header>
  <main id="app-view" tabindex="-1"></main>
  <footer class="footer">
    <div class="container row-between">
      <span>© <span id="year"></span> NEXUS ADMISSION · Choose Your Future. Build Your Legacy.</span>
      <span class="row"><span class="live-dot"></span> System online</span>
    </div>
  </footer>
